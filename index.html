<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F0F3F8" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("keyra.theme")
          const systemDark = matchMedia("(prefers-color-scheme: dark)").matches
          const theme = saved === "dark" || saved === "light" ? saved : systemDark ? "dark" : "light"
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#060F1E" : "#F0F3F8")
        } catch (_) {}
      })()
    </script>
    <title>Keyra - Type faster. Think sharper.</title>
    <meta name="description" content="Keyra: encrypted realtime typing races and practice." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
