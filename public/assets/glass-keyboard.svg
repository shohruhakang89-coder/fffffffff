<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 280" role="img" aria-labelledby="title">
  <title id="title">Liquid glass typing keys</title>
  <defs>
    <radialGradient id="orb" cx="34%" cy="23%" r="75%">
      <stop stop-color="white" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#BBD9FF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2C79FF" stop-opacity=".14"/>
    </radialGradient>
    <linearGradient id="key" x1="15" y1="10" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#DDEBFF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#7BB2FF" stop-opacity=".38"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#0A63EA" flood-opacity=".24"/>
    </filter>
  </defs>
  <ellipse cx="236" cy="145" rx="153" ry="118" fill="#3B82F6" fill-opacity=".15" filter="url(#blur)"/>
  <ellipse cx="236" cy="132" rx="146" ry="112" fill="url(#orb)" stroke="white" stroke-opacity=".55"/>
  <path d="M114 103C162 34 281 15 363 71" fill="none" stroke="white" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#14233B">
    <g transform="translate(146 74)"><rect width="68" height="68" rx="20" fill="url(#key)" stroke="white" stroke-opacity=".85"/><text x="34" y="41">K</text></g>
    <g transform="translate(222 68)"><rect width="68" height="68" rx="20" fill="url(#key)" stroke="white" stroke-opacity=".85"/><text x="34" y="41">E</text></g>
    <g transform="translate(298 78)"><rect width="68" height="68" rx="20" fill="url(#key)" stroke="white" stroke-opacity=".85"/><text x="34" y="41">Y</text></g>
    <g transform="translate(152 150)"><rect width="68" height="68" rx="20" fill="url(#key)" stroke="white" stroke-opacity=".85"/><text x="34" y="41">R</text></g>
    <g transform="translate(228 146)"><rect width="68" height="68" rx="20" fill="url(#key)" stroke="white" stroke-opacity=".85"/><text x="34" y="41">A</text></g>
    <g transform="translate(304 154)"><rect width="78" height="68" rx="20" fill="url(#key)" stroke="white" stroke-opacity=".85"/><text x="39" y="41" fill="#086FFF">GO</text></g>
  </g>
  <circle cx="118" cy="80" r="9" fill="white" fill-opacity=".76"/>
  <circle cx="94" cy="112" r="4" fill="#7DB7FF" fill-opacity=".8"/>
</svg>
